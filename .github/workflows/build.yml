# Builds a ForgeOffice release on every push to main: the Docker image and the installer zip
# (build/build.sh). Records the build number it used by committing build/BUILD_NUMBER back to
# main, so the next build gets the next number, then publishes a GitHub release with the zip.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

# One build at a time, so two pushes close together never take the same build number.
# A build already running is never cancelled (its number may be committed any moment).
concurrency:
  group: build-main
  cancel-in-progress: false

permissions:
  contents: write # to commit build/BUILD_NUMBER and publish the release

jobs:
  build:
    name: Build release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The commit that triggered this run may be older than main's latest build number
      # (another build committed one since): always count on from the newest.
      - name: Take the latest build number
        run: |
          git fetch origin main
          git checkout origin/main -- build/BUILD_NUMBER
          echo "Previous build: $(cat build/BUILD_NUMBER)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        run: build/build.sh

      - name: Find the release
        id: release
        run: |
          zip=$(ls dist/forgeoffice-*.zip | head -n 1)
          version=$(sed -n 's/^  "version": *"\([^"]*\)".*/\1/p' package.json | head -n 1)
          number=$(cat build/BUILD_NUMBER)
          ( cd dist && sha256sum "$(basename "$zip")" > "$(basename "$zip").sha256" )
          {
            echo "zip=$zip"
            echo "number=$number"
            echo "tag=v${version}-build-${number}"
            echo "title=ForgeOffice ${version} (build ${number})"
          } >> "$GITHUB_OUTPUT"

      # Only after a successful build. Pushes made with the workflow's own token don't start
      # another run, and [skip ci] makes sure of it.
      - name: Commit the build number
        env:
          NUMBER: ${{ steps.release.outputs.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -f -B ci-build-number origin/main
            echo "$NUMBER" > build/BUILD_NUMBER
            if git diff --quiet -- build/BUILD_NUMBER; then echo "Already recorded"; exit 0; fi
            git add build/BUILD_NUMBER
            git commit -m "Build ${NUMBER} [skip ci]"
            git push origin HEAD:main && exit 0
            echo "main moved on while committing; trying again"
            sleep 5
          done
          exit 1

      # After the build number is committed, so a failed commit never leaves a release whose
      # number the next build would take again. The tag marks the commit that was built.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.release.outputs.zip }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
        run: |
          name=$(basename "$ZIP")
          {
            echo "## Installing"
            echo
            echo "On a 64-bit Linux server (\`$(echo "$name" | sed 's/.*-\([a-z0-9]*\)\.zip$/\1/')\`):"
            echo
            echo '```bash'
            echo "unzip ${name} && cd ${name%.zip}"
            echo "sudo ./install.sh"
            echo '```'
            echo
            echo "Run the same on an installed server to upgrade it (data is kept). Check the download with \`sha256sum -c ${name}.sha256\`. More in INSTALL.txt inside the zip."
            echo
          } > release-notes.md
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --generate-notes \
            --latest
          echo "### [${TITLE}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})" >> "$GITHUB_STEP_SUMMARY"
